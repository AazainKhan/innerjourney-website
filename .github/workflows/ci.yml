name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      # Fails if CMS edits on main still use the pre-September-2026 content
      # shape (run `npm run migrate-content` and commit the result).
      - name: Content shape
        run: npm run migrate-content -- --check
